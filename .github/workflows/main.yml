name: BlazeX Kernel Build

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    env:
      ARCH: arm64
      SUBARCH: arm64
      OUTDIR: out
      DEFCONFIG: defconfig
      SAMSUNG_CONFIG: arch/arm64/configs/vendor/samsung/r8q.config

    steps:
    - name: 📥 Checkout source
      uses: actions/checkout@v4
      with:
        submodules: true
        fetch-depth: 1

    - name: 🛠 Install dependencies
      run: |
        sudo apt update
        sudo apt install -y \
          bc bison build-essential curl flex git \
          libelf-dev libssl-dev libncurses-dev \
          python3 zip rsync ccache

    - name: 📥 Download AOSP Clang + GCC
      run: |
        mkdir toolchain && cd toolchain

        # AOSP Clang (STABLE for Samsung)
        curl -LO https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/master/clang-r450784.tar.gz
        mkdir clang && tar -xf clang-r450784.tar.gz -C clang

        # GCC
        git clone --depth=1 https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9 gcc64
        git clone --depth=1 https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/arm/arm-linux-androideabi-4.9 gcc32

    - name: ⚙️ Configure kernel
      run: |
        export PATH=$(pwd)/toolchain/clang/bin:$PATH
        mkdir -p $OUTDIR

        make O=$OUTDIR ARCH=arm64 $DEFCONFIG
        scripts/kconfig/merge_config.sh -O $OUTDIR \
          $OUTDIR/.config $SAMSUNG_CONFIG

        make O=$OUTDIR ARCH=arm64 olddefconfig

    - name: 🔨 Build kernel (SAFE MODE)
      run: |
        make -j$(nproc) O=$OUTDIR \
          ARCH=arm64 \
          CC=clang \
          LD=ld.bfd \
          AR=llvm-ar \
          NM=llvm-nm \
          OBJCOPY=llvm-objcopy \
          OBJDUMP=llvm-objdump \
          STRIP=llvm-strip \
          CROSS_COMPILE=$(pwd)/toolchain/gcc64/bin/aarch64-linux-android- \
          CROSS_COMPILE_ARM32=$(pwd)/toolchain/gcc32/bin/arm-linux-androideabi- \
          LLVM=0 \
          LLVM_IAS=0 \
          KCFLAGS=-Wno-error

    - name: 📦 Package AnyKernel3
      run: |
        git clone https://github.com/osm0sis/AnyKernel3 --depth=1
        cp $OUTDIR/arch/arm64/boot/Image.gz-dtb AnyKernel3/ || \
        cp $OUTDIR/arch/arm64/boot/Image.gz AnyKernel3/
        cd AnyKernel3
        sed -i 's/device.name1=.*/device.name1=r8q/' anykernel.sh
        zip -r9 ../BlazeX-S20FE-Kernel.zip *

    - name: ⬆️ Upload
      uses: actions/upload-artifact@v4
      with:
        name: BlazeX-Kernel-S20FE
        path: BlazeX-S20FE-Kernel.zip
