name: BlazeX Kernel Build

on:
  push:
    branches: [ "master", "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    env:
      ARCH: arm64
      SUBARCH: arm64
      OUTDIR: out
      DEFCONFIG: defconfig
      SAMSUNG_CONFIG: arch/arm64/configs/vendor/samsung/r8q.config

    steps:
    - name: 📥 Checkout source
      uses: actions/checkout@v4
      with:
        submodules: true
        fetch-depth: 1

    - name: 🛠 Install build dependencies
      run: |
        sudo apt update
        sudo apt install -y bc bison build-essential curl flex git libelf-dev libssl-dev libncurses-dev python3 zip

    - name: 📥 Download Proton Clang & AOSP GCC
      run: |
        mkdir toolchain
        cd toolchain
        # Proton Clang is reliable and includes all LLVM tools
        curl -LO https://github.com/kdrag0n/proton-clang/archive/refs/heads/master.tar.gz
        mkdir clang && tar -xf master.tar.gz -C clang --strip-components=1
        # GCC is needed for certain kernel headers/objects
        git clone --depth=1 https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9 -b master gcc64
        git clone --depth=1 https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/arm/arm-linux-androideabi-4.9 -b master gcc32

    - name: ⚙️ Load & Merge Defconfig
      run: |
        # DO NOT export PATH globally here to avoid breaking host tools
        export CLANG_BIN=$(pwd)/toolchain/clang/bin
        mkdir -p $OUTDIR
        
        # Base Config
        make O=$OUTDIR ARCH=arm64 CC=$CLANG_BIN/clang $DEFCONFIG
        
        # Merge Samsung r8q config
        if [ -f $SAMSUNG_CONFIG ]; then
          scripts/kconfig/merge_config.sh -O $OUTDIR $OUTDIR/.config $SAMSUNG_CONFIG
        else
          echo "SAMSUNG_CONFIG not found at $SAMSUNG_CONFIG"
          exit 1
        fi

    - name: 🔧 Disable problematic Samsung options
      run: |
        ./scripts/config --file $OUTDIR/.config --disable CONFIG_LD_IS_LLD
        ./scripts/config --file $OUTDIR/.config --disable CONFIG_LTO_CLANG
        ./scripts/config --file $OUTDIR/.config --disable CONFIG_CFI_CLANG
        make O=$OUTDIR ARCH=arm64 CC=$(pwd)/toolchain/clang/bin/clang olddefconfig

    - name: 🔨 Build kernel
      run: |
        # Set paths as variables
        TC_DIR=$(pwd)/toolchain
        CLANG_BIN=$TC_DIR/clang/bin
        GCC64_BIN=$TC_DIR/gcc64/bin
        GCC32_BIN=$TC_DIR/gcc32/bin
        
        # Build using explicit tool paths to prevent PATH pollution
        make -j$(nproc --all) O=$OUTDIR \
          ARCH=arm64 \
          CC=$CLANG_BIN/clang \
          LD=$CLANG_BIN/ld.lld \
          AR=$CLANG_BIN/llvm-ar \
          NM=$CLANG_BIN/llvm-nm \
          OBJCOPY=$CLANG_BIN/llvm-objcopy \
          OBJDUMP=$CLANG_BIN/llvm-objdump \
          STRIP=$CLANG_BIN/llvm-strip \
          CROSS_COMPILE=$GCC64_BIN/aarch64-linux-android- \
          CROSS_COMPILE_ARM32=$GCC32_BIN/arm-linux-androideabi- \
          CLANG_TRIPLE=aarch64-linux-gnu- \
          LLVM=1 \
          LLVM_IAS=1

    - name: ✅ Verify Image
      run: |
        if [ -f $OUTDIR/arch/arm64/boot/Image.gz-dtb ]; then
            echo "IMAGE_TYPE=Image.gz-dtb" >> $GITHUB_ENV
        else
            echo "IMAGE_TYPE=Image.gz" >> $GITHUB_ENV
        fi

    - name: 📦 AnyKernel3 ZIP
      run: |
        git clone https://github.com/osm0sis/AnyKernel3 --depth=1
        cp $OUTDIR/arch/arm64/boot/${{ env.IMAGE_TYPE }} AnyKernel3/
        [ -f $OUTDIR/arch/arm64/boot/dtbo.img ] && cp $OUTDIR/arch/arm64/boot/dtbo.img AnyKernel3/
        cd AnyKernel3
        sed -i 's/device.name1=maguro/device.name1=r8q/g' anykernel.sh
        zip -r9 ../BlazeX-S20FE-Kernel.zip *

    - name: ⬆️ Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: BlazeX-Kernel-S20FE
        path: BlazeX-S20FE-Kernel.zip
