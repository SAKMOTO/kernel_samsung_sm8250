name: Build OneUI Kernel - S20 FE (r8q)

on:
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab
  push:
    branches: [ "master" ] # Trigger on push to master

jobs:
  build-kernel:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc build-essential zip gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi libssl-dev libncurses5-dev binutils-aarch64-linux-gnu python3

      - name: Pull Reliable Toolchains
        run: |
          mkdir toolchain
          cd toolchain
          # Clang 14 from a stable mirror (Prevents 400 Bad Request error)
          git clone --depth=1 https://github.com/ZyCromerZ/Clang.git -b 14 clang
          # GCC 4.9 for cross-compiling
          git clone --depth=1 https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9 -b master gcc64
          git clone --depth=1 https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/arm/arm-linux-androideabi-4.9 -b master gcc32

      - name: Build Kernel
        run: |
          # Set Paths
          export PATH=$(pwd)/toolchain/clang/bin:$(pwd)/toolchain/gcc64/bin:$(pwd)/toolchain/gcc32/bin:$PATH
          
          # Build Variables
          export ARCH=arm64
          export SUBARCH=arm64
          export KBUILD_COMPILER_STRING="Clang 14.0 (AOSP)"
          
          # 1. Setup Config for OneUI S20 FE
          make O=out vendor/r8q_defconfig
          
          # 2. Compile
          make -j$(nproc --all) O=out \
                      CC=clang \
                      CROSS_COMPILE=aarch64-linux-android- \
                      CROSS_COMPILE_ARM32=arm-linux-androideabi- \
                      CLANG_TRIPLE=aarch64-linux-gnu- \
                      LLVM=1 \
                      LD=ld.lld

      - name: Package with AnyKernel3 (Flashable Zip)
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git AnyKernel3
          cp out/arch/arm64/boot/Image.gz-dtb AnyKernel3/ || cp out/arch/arm64/boot/Image.gz AnyKernel3/
          cd AnyKernel3
          # Simple script to update AnyKernel3 config for S20 FE
          sed -i 's/device.name1=maguro/device.name1=r8q/g' anykernel.sh
          zip -r ../S20FE_Kernel_Build.zip *

      - name: Upload Flashable Kernel
        uses: actions/upload-artifact@v4
        with:
          name: OneUI-S20FE-r8q-Kernel
          path: S20FE_Kernel_Build.zip
