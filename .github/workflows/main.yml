name: Build OneUI Kernel - S20 FE (r8q)

on:
  workflow_dispatch:
  push:
    branches: [ "master" ]

jobs:
  build-kernel:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc build-essential zip gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi libssl-dev libncurses5-dev binutils-aarch64-linux-gnu python3 libssl-dev

      - name: Pull Toolchains
        run: |
          mkdir toolchain
          cd toolchain
          # Clang 14 contains the ld.lld we need
          git clone --depth=1 https://github.com/ZyCromerZ/Clang.git -b 14 clang
          git clone --depth=1 https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9 -b master gcc64
          git clone --depth=1 https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/arm/arm-linux-androideabi-4.9 -b master gcc32

      - name: Build Kernel
        run: |
          # 1. Define Absolute Paths
          TOOLCHAIN_DIR=$(pwd)/toolchain
          CLANG_BIN=$TOOLCHAIN_DIR/clang/bin
          GCC64_BIN=$TOOLCHAIN_DIR/gcc64/bin
          GCC32_BIN=$TOOLCHAIN_DIR/gcc32/bin
          
          # 2. Add to PATH
          export PATH=$CLANG_BIN:$GCC64_BIN:$GCC32_BIN:$PATH
          
          # 3. Define the Linker explicitly to avoid "not found" error
          # This is the secret fix: passing the full path to the LD variable
          LD_PATH=$CLANG_BIN/ld.lld
          
          export ARCH=arm64
          export SUBARCH=arm64
          export OUT_DIR=out
          
          # 4. Generate Base Config
          # We pass LD here too so the config check doesn't fail
          make O=$OUT_DIR ARCH=arm64 LD=$LD_PATH defconfig
          
          # 5. Merge Samsung Config
          scripts/kconfig/merge_config.sh -O $OUT_DIR $OUT_DIR/.config arch/arm64/configs/vendor/samsung/r8q.config
          
          # 6. Final Compile
          # Passing LLVM=1 and LLVM_IAS=1 plus the explicit LD path
          make -j$(nproc --all) O=$OUT_DIR \
                      ARCH=arm64 \
                      LLVM=1 \
                      LLVM_IAS=1 \
                      LD=$LD_PATH \
                      CROSS_COMPILE=aarch64-linux-android- \
                      CROSS_COMPILE_ARM32=arm-linux-androideabi- \
                      CLANG_TRIPLE=aarch64-linux-gnu-

      - name: Package AnyKernel3
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git AnyKernel3
          # Find the built image
          if [ -f out/arch/arm64/boot/Image.gz-dtb ]; then
            cp out/arch/arm64/boot/Image.gz-dtb AnyKernel3/
          elif [ -f out/arch/arm64/boot/Image.gz ]; then
            cp out/arch/arm64/boot/Image.gz AnyKernel3/
          else
            cp out/arch/arm64/boot/Image AnyKernel3/
          fi
          
          cd AnyKernel3
          sed -i 's/device.name1=maguro/device.name1=r8q/g' anykernel.sh
          zip -r ../S20FE_r8q_OneUI_Kernel.zip *

      - name: Upload Kernel
        uses: actions/upload-artifact@v4
        with:
          name: S20FE-r8q-Kernel
          path: S20FE_r8q_OneUI_Kernel.zip
