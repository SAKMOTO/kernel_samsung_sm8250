name: Build OneUI Kernel - S20 FE (r8q)

on:
  workflow_dispatch:
  push:
    branches: [ "master" ]

jobs:
  build-kernel:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc build-essential zip gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi libssl-dev libncurses5-dev binutils-aarch64-linux-gnu python3 libssl-dev

      - name: Pull Toolchains
        run: |
          mkdir toolchain
          cd toolchain
          # Using a more standard AOSP Clang mirror that doesn't have nested folders
          git clone --depth=1 https://github.com/n00b-m4st3r/patch-arm64-clang -b master clang
          git clone --depth=1 https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9 -b master gcc64
          git clone --depth=1 https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/arm/arm-linux-androideabi-4.9 -b master gcc32

      - name: Build Kernel
        run: |
          # 1. Setup absolute paths and permissions
          TOOLCHAIN_DIR=$(pwd)/toolchain
          chmod +x $TOOLCHAIN_DIR/clang/bin/*
          
          # 2. Setup Environment
          export PATH=$TOOLCHAIN_DIR/clang/bin:$TOOLCHAIN_DIR/gcc64/bin:$TOOLCHAIN_DIR/gcc32/bin:$PATH
          export ARCH=arm64
          export SUBARCH=arm64
          export OUT_DIR=out
          
          # 3. Use standard LLVM variable instead of forcing LD path
          # This allows the Makefile to find ld.lld in the PATH automatically
          
          # Generate Base Config
          make O=$OUT_DIR ARCH=arm64 CC=clang CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-android- defconfig
          
          # Merge Samsung Config
          scripts/kconfig/merge_config.sh -O $OUT_DIR $OUT_DIR/.config arch/arm64/configs/vendor/samsung/r8q.config
          
          # 4. Final Compile
          # We use LLVM=1 which is the most compatible way for SM8250
          make -j$(nproc --all) O=$OUT_DIR \
                      ARCH=arm64 \
                      CC=clang \
                      LD=ld.lld \
                      AR=llvm-ar \
                      NM=llvm-nm \
                      OBJCOPY=llvm-objcopy \
                      OBJDUMP=llvm-objdump \
                      STRIP=llvm-strip \
                      CLANG_TRIPLE=aarch64-linux-gnu- \
                      CROSS_COMPILE=aarch64-linux-android- \
                      CROSS_COMPILE_ARM32=arm-linux-androideabi- \
                      LLVM=1 \
                      LLVM_IAS=1

      - name: Package AnyKernel3
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git AnyKernel3
          # Copy images
          if [ -f out/arch/arm64/boot/Image.gz-dtb ]; then
            cp out/arch/arm64/boot/Image.gz-dtb AnyKernel3/
          elif [ -f out/arch/arm64/boot/Image.gz ]; then
            cp out/arch/arm64/boot/Image.gz AnyKernel3/
          fi
          
          # Include dtbo if it exists (Recommended for S20 FE)
          if [ -f out/arch/arm64/boot/dtbo.img ]; then
            cp out/arch/arm64/boot/dtbo.img AnyKernel3/
          fi
          
          cd AnyKernel3
          sed -i 's/device.name1=maguro/device.name1=r8q/g' anykernel.sh
          zip -r ../S20FE_r8q_Kernel.zip *

      - name: Upload Kernel
        uses: actions/upload-artifact@v4
        with:
          name: S20FE-r8q-Kernel-OneUI
          path: S20FE_r8q_Kernel.zip
